name: Timebasert aksjerobot

on:
  schedule:
    - cron: '0 8,12,17 * * *'  # Kjører tre ganger om dagen: 08:00, 12:00 og 17:00 UTC
  workflow_dispatch:        # Lar deg starte den manuelt med en knapp for å teste

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Henter koden din
        uses: actions/checkout@v4

      - name: Setter opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installerer pakker
        run: pip install requests yfinance google-genai

      - name: Kjører roboten
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python robot.py

