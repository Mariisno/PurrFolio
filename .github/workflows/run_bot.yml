name: Timebasert aksjerobot

on:
  schedule:
    - cron: '0 8-20 * * *'  # Kjører hver time fra 08:00 til 20:59 (pause 21:00-07:59)
  workflow_dispatch:        # Lar deg starte den manuelt med en knapp for å teste

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Henter koden din
        uses: actions/checkout@v4

      - name: Setter opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installerer pakker
        run: pip install requests yfinance google-genai

      - name: Kjører roboten
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python robot.py

